<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div>
            <h2>Wie oft trainierst du aktuell?</h2>
            <ul>
                <li data-info="1"><button>nie</button></li>
                <li data-info="2"><button>1-2x/Woche</button></li>
                <li data-info="3"><button>3-5x/Woche</button></li>
                <li data-info="4"><button>6-7x/Woche</button></li>
            </ul>
        </div>
        <div>
            <h2>Was ist dein Hauptziel?</h2>
            <ul>
                <li data-info="5"><button>abnehmen</button></li>
                <li data-info="6"><button>zunehmen</button></li>
                <li data-info="7"><button>Gewicht halten und (sichtbar) fitter werden</button></li>
            </ul>
        </div>
        <div>
            <h2>Welche Utensilien wirst du verwenden?</h2>
            <ul>
                <li data-info="8"><button>Turnschuhe</button></li>
                <li data-info="9"><button>Turnschuhe, Springseil, Klimmzugstange</button></li>
                <li data-info="10"><button>Fitnessstudio</button></li>
            </ul>
        </div>
        <div>
            <h2>Wie viele saubere Liegestütze bzw. Klimmzüge schaffst du?</h2>
            <ul>
                <li data-info="11"><button>0-20 Liegestütze, 0-10 Klimmzüge</button></li>
                <li data-info="12"><button>20-50 Liegestütze, 10-25 Klimmzüge</button></li>
                <li data-info="13"><button>50+ Liegestütze, 25+ Klimmzüge</button></li>
            </ul>
        </div>
        <button class="zurueck">zurueck</button>
        <button class="auswerten">auswerten</button>
        <p class="auswertung"></p>
    </main>


    <script src="script.js"></script>
</body>
</html>
