<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header>
        <h1 class="text-[28px] bg-[rgb(187,187,243)] p-[30px]">Playground</h1>
    </header>
    <main class="main bg-[linear-gradient(0deg,rgb(241,193,233),rgb(187,187,243))] pt-[80px] pb-[80px]">
      
      <div> 
        <img src="./Bildschirmfoto 2026-06-21 um 09.00.31.png" alt="something" class="something w-screen h-screen hidden">

        <p class="pl-[30px]">Enter a value between 0 and 360 to rotate the background.</p>
        <input type="text" class="input border rounded-[8px] mt-[30px] mb-[30px] ml-[30px] w-[80px]">
        <button class="button bg-[rgb(241,193,233)] ml-[30px] mb-[30px] border rounded-[8px] pl-[5px] pr-[5px]">ok</button>
      </div>

      <div>
        <p class="pl-[30px]">click
        <button class="hereButton bg-[rgb(241,193,233)] border rounded-[8px] pl-[5px] pr-[5px]"">here</button>
        to see something</p>
      </div>
      
      <div>  
        <img src="./MathClipArt--Single-Die-with-1-Showing.png.webp" alt="1" class="img dice w-[100px] m-[30px]">
      </div>
    
      <div>  
        <button class="ynmButton ml-[30px] bg-[rgb(241,193,233)] border rounded-[8px] pl-[5px] pr-[5px]">Should I ...?</button>
        <p class="answer m-[30px]"></p>    
      </div>

      <div>
        <h2 class="pl-[30px] text-[20px]">useless button</h2>
        <img class="schalter pl-[30px] w-[155px]" src="./Bildschirmfoto 2026-07-10 um 18.32.06.png" alt="Schalter off">
        <p class="pl-[30px]">Caution: useless</p>
      </div>

    </main>
    <footer class="bg-[rgb(241,193,233)]">
        <p class="p-[30px]">©2026</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
