<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <div class="box">
    <button class="enter">=</button>
    <input class="input" type="text" placeholder="0">
    </div>
    <div class="calc">
    <table>
        <tr>
            <td class="nr"><button class="r">7</button></td>
            <td class="nr"><button class="r">8</button></td>
            <td class="nr"><button class="r">9</button></td>
            <td class="symbol"><button class="r">+</button></td>
        </tr>
        <tr>
            <td class="nr"><button class="r">4</button></td>
            <td class="nr"><button class="r">5</button></td>
            <td class="nr"><button class="r">6</button></td>
            <td class="symbol"><button class="r">-</button></td>
        </tr>
        <tr>
            <td class="nr"><button class="r">1</button></td>
            <td class="nr"><button class="r">2</button></td>
            <td class="nr"><button class="r">3</button></td>
            <td class="symbol"><button class="r">*</button></td>
        </tr>
        <tr>
            <td class="nr"><button class="r">0</button></td>
            <td class="nr"><button class="r">.</button></td>
            <td class="delete"><button>dlt</button></td>
            <td class="symbo"><button class="r">/</button></td>
        </tr>
    </table>
  
    </div>

    <script src="./script.js"></script>
</body>
</html>
